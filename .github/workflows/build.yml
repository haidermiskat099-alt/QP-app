name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          if [ -d "QP-app-main/android" ]; then
            cd QP-app-main/android
          elif [ -d "android" ]; then
            cd android
          else
            cd QP-app/QP-app-main/android
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
